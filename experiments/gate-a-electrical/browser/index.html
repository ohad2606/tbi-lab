<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TBI Lab Gate A browser harness</title>
  </head>
  <body>
    <p>Gate A feasibility harness. No product UI: this page exists only to host the worker.</p>
    <script type="module">
      const worker = new Worker('./worker.js', { type: 'module' });

      window.__call = (message) =>
        new Promise((resolve, reject) => {
          const timer = setTimeout(() => reject(new Error('worker timeout')), 120000);
          worker.onmessage = (e) => {
            clearTimeout(timer);
            resolve(e.data);
          };
          worker.onerror = (e) => {
            clearTimeout(timer);
            reject(new Error(e.message));
          };
          worker.postMessage(message);
        });

      // Main-thread liveness counter. If the solver ever ran on the main thread, this
      // would stop advancing while a solve is in progress.
      window.__tick = 0;
      (function loop() {
        window.__tick++;
        setTimeout(loop, 1);
      })();

      window.__ready = true;
    </script>
  </body>
</html>
