# Sprint 8 (D-S8-1), installed as /etc/tmpfiles.d/tbi-gate.conf for the dev-lab target: the
# directory of Caddy's internal-origin socket. Only Caddy (owner) and the gate group
# (oauth2-proxy) can traverse it, so no other local process can reach the internal origin.
# setgid: the socket Caddy binds here gets group tbi-gate (Caddy 2.6 cannot set a socket's
# group or mode itself; with caddy-gate.conf's UMask=0007 the socket is 0770 caddy:tbi-gate).
d /run/tbi-gate 2750 caddy tbi-gate -
