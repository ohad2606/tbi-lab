# Sprint 8 (D-S8-1), installed as /etc/systemd/system/caddy.service.d/tbi-gate.conf for the
# dev-lab target. Caddy 2.6 creates its unix listener with the process umask; 0007 makes the
# internal-origin socket connectable by the gate group (oauth2-proxy), and by nobody else
# (the directory /run/tbi-gate is 2750 caddy:tbi-gate, tbi-gate.conf).
[Service]
UMask=0007
