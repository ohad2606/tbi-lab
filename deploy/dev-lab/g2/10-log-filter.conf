# Sprint 13 G2 (b), INSTALLED 2026-10-13 as /etc/systemd/system/oauth2-proxy.service.d/10-log-filter.conf
# journald drops, at ingestion (so neither the journal nor rsyslog's /var/log/syslog stores them):
#  - oauth2-proxy v7.15.4's dump of a whole request on a callback failure (oauthproxy.go:921,
#    1352-1368: Println(req, ...)), which carries the callback code and state and the browser's
#    Cookie header, a still-valid session cookie included;
#  - any line quoting a callback query (code, state).
# Kept: login starts, [AuthSuccess]/[AuthFailure] with request id, the token-validation line
# (token truncated to 5 characters by oauth2-proxy), errors, the request log of other paths.
# systemd strips trailing spaces from values, so the patterns have none. Needs systemd >= 253.
[Service]
LogFilterPatterns=~&\{(GET|POST|HEAD)
LogFilterPatterns=~/oauth2/callback\?
