# oauth2-proxy for dev-lab.tbi-tech.net. Installed as /etc/oauth2-proxy/oauth2-proxy.cfg.
#
# No identifiers or secrets are committed. They come from the root-only environment file
# /etc/oauth2-proxy/oauth2-proxy.env (see oauth2-proxy.env.example):
#   OAUTH2_PROXY_CLIENT_ID, OAUTH2_PROXY_CLIENT_SECRET, OAUTH2_PROXY_COOKIE_SECRET
# The allowed email addresses (one per line) live in /etc/oauth2-proxy/allowed-emails (not
# committed).

http_address = "127.0.0.1:4180"
reverse_proxy = true
# Only Caddy, on this host, may set X-Forwarded-* headers.
trusted_proxy_ips = ["127.0.0.1/32", "::1/128"]

# Identity provider: Google (PM decision, 2026-09-25; replaces the Auth0 plan).
provider = "google"
redirect_url = "https://dev-lab.tbi-tech.net/oauth2/callback"
# Always show Google's account chooser: after sign-out, a still-signed-in Google account is
# never re-used silently.
prompt = "select_account"
skip_provider_button = true

# Exact-email allowlist. No domain is allowed as a whole (email_domains stays empty), so only
# the addresses in the file get through; any other Google account is refused with 403.
authenticated_emails_file = "/etc/oauth2-proxy/allowed-emails"
email_domains = []

# The whole site is behind authentication: static assets, HTML, sourcemaps, everything, and
# since Sprint 6 the ESP32 runtime API under /runtime/.
# Sprint 8: the internal origin is a unix socket (only this proxy, group tbi-gate, can reach it).
upstreams = ["unix:///run/tbi-gate/internal.sock"]
# Event streams (text/event-stream) are flushed immediately by the proxy and are not cut by the
# upstream timeout: measured 2026-09-26 (362 events over 42 s, largest gap 0.21 s).

# Session cookie: host-only, HTTPS-only, not readable by scripts.
cookie_name = "__Host-tbi_dev_lab"
cookie_secure = true
cookie_httponly = true
cookie_samesite = "lax"
cookie_expire = "8h"

pass_access_token = false
set_xauthrequest = false
request_logging = true
# Sprint 8: the per-request log carries no user identifier (the default format logs the account's
# email on every request). Requests are correlated by request id; logins stay in the auth log.
request_logging_format = "{{.Client}} - {{.RequestID}} - [{{.Timestamp}}] {{.Host}} {{.RequestMethod}} {{.Upstream}} {{.RequestURI}} {{.Protocol}} {{.UserAgent}} {{.StatusCode}} {{.ResponseSize}} {{.RequestDuration}}"
auth_logging = true
standard_logging = true
